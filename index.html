<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
        <nav>
            <div class="nav-bar-mobile">
                <img src="assets\logo-helpDesk.jpg">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>
    </header>
    <main>
        <section class="cader-de-section1">
            <div>
                <h1>Gestion des demandes</h1>
                <p>Suivez et gérez les incidents informatiques.</p>
            </div>
            <div class="cader-de-form">
                <h2>Créer une demande</h2>
                <p>Décrivez votre problème informatique.</p>
                <form action="" class="forms-med">
                    <div class="titre ">
                        <label for="Titre">Titre du problème *</label><br><br>
                        <input type="text" class="input-decore" id="Titre" name="Titre"
                            placeholder="  Connexion Wi-Fi instable  " required>
                    </div>
                    <div>

                        <label for="Réseaux">Catégorie *</label><br><br>
                        <select class="input-selection" id="Réseaux" name="Réseau" required>
                            <!-- <option value="">Choisir Catégorie</option> -->
                            <option value="Matériel">Matériel</option>
                            <option value="Logiciel">Logiciel</option>
                            <option value="Réseau">Réseau</option>

                        </select>
                    </div>
                    <div>

                        <label for="Priorité">Priorité *</label><br><br>
                        <select class="input-selection" id="Priorité" name="Priorité" required>
                            <option value="Haute">Haute</option>
                            <option value="Normale">Normale</option>
                            <option value="Basse">Basse</option>
                        </select>
                    </div>
                    <div class="desc input-information">
                        <label for="description">description *</label><br><br>
                        <textarea name="msg" class="input-text" id="description" cols="20" rows="5"
                            placeholder="  Décrivez votre problème...  "></textarea>
                    </div>

                    <button class=" grand-btn input-decore-btn" id="Ajout">+ Ajouter la demande</button>

                </form>
            </div>
        </section>
        <section>
            <div class="Ndemande-Crt-Tbl" >
                 <div class="nomber-demande">
                <h3 class="listD">Liste des demandes</h3>
                <p id="Ncartes"> demandes</p>
                </div>
                <div class="Carte-Tablaeaux"> 
                    <button class="Carte" id="cart">▦  Cartes</button>
                    <button class="Tabeaux" id="tabl">☷  Tableau</button>
                </div>
            </div>
           
            
        </section>
        <section>
            <div class="articls">


            </div>

        </section>
        <section>
            <form action=""></form>
        </section>
    </main>
    <script src="JS/script.js"></script>
</body>

</html>
